syntax = "proto3";

package video_editor.persistence.v1;

message EntityId {
  bytes value = 1;
}

message Time {
  sint64 value = 1;
  uint32 timescale = 2;
}

message TimeRange {
  Time start = 1;
  Time duration = 2;
}

message Rate {
  uint32 numerator = 1;
  uint32 denominator = 2;
}

message Vec2 {
  double x = 1;
  double y = 2;
}

message ColorRgba {
  double red = 1;
  double green = 2;
  double blue = 3;
  double alpha = 4;
}

enum TitleAlignment {
  TITLE_ALIGNMENT_UNSPECIFIED = 0;
  TITLE_ALIGNMENT_LEFT = 1;
  TITLE_ALIGNMENT_CENTER = 2;
  TITLE_ALIGNMENT_RIGHT = 3;
}

message Title {
  string text = 1;
  string font_family = 2;
  double font_size = 3;
  ColorRgba text_color = 4;
  ColorRgba background_color = 5;
  TitleAlignment alignment = 6;
  bool bold = 7;
  bool italic = 8;
}

message StringEntry {
  string key = 1;
  string value = 2;
}

enum KeyframeInterpolation {
  KEYFRAME_INTERPOLATION_UNSPECIFIED = 0;
  KEYFRAME_INTERPOLATION_HOLD = 1;
  KEYFRAME_INTERPOLATION_LINEAR = 2;
  KEYFRAME_INTERPOLATION_BEZIER = 3;
}

message EffectValue {
  oneof value {
    sint64 integer_value = 1;
    double double_value = 2;
    bool boolean_value = 3;
    string string_value = 4;
    Time time_value = 5;
    Vec2 vec2_value = 6;
    ColorRgba color_value = 7;
  }
}

message Keyframe {
  EntityId id = 1;
  Time time = 2;
  EffectValue value = 3;
  KeyframeInterpolation interpolation = 4;
  Vec2 incoming_control = 5;
  Vec2 outgoing_control = 6;
}

message EffectParameter {
  string id = 1;
  EffectValue value = 2;
  repeated Keyframe keyframes = 3;
}

message Effect {
  EntityId id = 1;
  string type = 2;
  uint32 version = 3;
  bool enabled = 4;
  bool known = 5;
  repeated EffectParameter parameters = 6;
  bytes opaque_payload = 7;
}

message Transform {
  Vec2 position = 1;
  Vec2 scale = 2;
  double rotation_degrees = 3;
  double anchor_x = 4;
  double anchor_y = 5;
  double crop_left = 6;
  double crop_top = 7;
  double crop_right = 8;
  double crop_bottom = 9;
  double opacity = 10;
}

message Asset {
  EntityId id = 1;
  string name = 2;
  string source_uri = 3;
  string fingerprint = 4;
  Time duration = 5;
  bool has_video = 6;
  bool has_audio = 7;
  uint32 width = 8;
  uint32 height = 9;
  optional Rate nominal_frame_rate = 10;
  uint32 audio_sample_rate = 11;
  uint32 audio_channels = 12;
  repeated StringEntry metadata = 13;
  optional EntityId bin_id = 14;
  optional string display_title = 15;
  repeated string tags = 16;
  optional string notes = 17;
  optional int32 rating = 18;
  optional string production_scene = 19;
  optional string production_shot = 20;
  optional string production_take = 21;
  optional string production_camera = 22;
  optional string production_reel = 23;
  optional string production_audio_roll = 24;
  optional string production_source_timecode = 25;
  optional bool production_preferred_take = 26;
  repeated AudioChannelDescriptor audio_channel_map = 27;
  optional uint32 monitor_left_channel = 28;
  optional uint32 monitor_right_channel = 29;
}

message AudioChannelDescriptor {
  uint32 index = 1;
  string label = 2;
}

enum TrackKind {
  TRACK_KIND_UNSPECIFIED = 0;
  TRACK_KIND_VIDEO = 1;
  TRACK_KIND_AUDIO = 2;
  TRACK_KIND_CAPTION = 3;
}

enum ClipKind {
  CLIP_KIND_UNSPECIFIED = 0;
  CLIP_KIND_VIDEO = 1;
  CLIP_KIND_AUDIO = 2;
  CLIP_KIND_TITLE = 3;
  CLIP_KIND_NESTED_SEQUENCE = 4;
}

enum BlendMode {
  BLEND_MODE_UNSPECIFIED = 0;
  BLEND_MODE_NORMAL = 1;
  BLEND_MODE_ADD = 2;
  BLEND_MODE_MULTIPLY = 3;
  BLEND_MODE_SCREEN = 4;
  BLEND_MODE_OVERLAY = 5;
}

enum TransitionKind {
  TRANSITION_KIND_UNSPECIFIED = 0;
  TRANSITION_KIND_CROSS_DISSOLVE = 1;
  TRANSITION_KIND_DIP_TO_BLACK = 2;
}

message Transition {
  EntityId id = 1;
  EntityId outgoing_clip_id = 2;
  EntityId incoming_clip_id = 3;
  TimeRange timeline_range = 4;
  TransitionKind kind = 5;
  bool enabled = 6;
}

message Clip {
  EntityId id = 1;
  EntityId asset_id = 2;
  ClipKind kind = 3;
  string name = 4;
  TimeRange timeline_range = 5;
  TimeRange source_range = 6;
  Rate playback_rate = 7;
  bool reversed = 8;
  optional EntityId linked_group = 9;
  Transform transform = 10;
  BlendMode blend_mode = 11;
  double audio_gain_db = 12;
  double audio_pan = 13;
  Time fade_in = 14;
  Time fade_out = 15;
  repeated Effect effects = 16;
  optional Title title = 17;
  optional EntityId nested_sequence_id = 18;
  optional bool enabled = 19;
  optional ColorRgba label_color = 20;
}

message Track {
  EntityId id = 1;
  TrackKind kind = 2;
  string name = 3;
  bool locked = 4;
  bool muted = 5;
  bool solo = 6;
  repeated Clip clips = 7;
  repeated Effect effects = 8;
  // Optional so schema-v2 payloads written before these fields retain the
  // model defaults when decoded.
  optional bool visible = 9;
  optional bool targeted = 10;
  // Optional mixer-strip fields. Absence means the canonical model defaults
  // (0 dB and center pan), preserving schema-v1 and early schema-v2 readers.
  optional double audio_gain_db = 11;
  optional double audio_pan = 12;
}

message Marker {
  EntityId id = 1;
  TimeRange range = 2;
  string label = 3;
  ColorRgba color = 4;
}

message CaptionStyle {
  string font_family = 1;
  double font_size = 2;
  ColorRgba text_color = 3;
  ColorRgba background_color = 4;
  bool bold = 5;
  bool italic = 6;
  CaptionAlignment alignment = 7;
  optional double vertical_position = 8;
  optional double safe_margin = 9;
  optional double outline_width = 10;
  optional ColorRgba outline_color = 11;
}

enum CaptionAlignment {
  CAPTION_ALIGNMENT_UNSPECIFIED = 0;
  CAPTION_ALIGNMENT_LEFT = 1;
  CAPTION_ALIGNMENT_CENTER = 2;
  CAPTION_ALIGNMENT_RIGHT = 3;
}

enum CaptionWordSource {
  CAPTION_WORD_SOURCE_UNSPECIFIED = 0;
  CAPTION_WORD_SOURCE_IMPORTED = 1;
  CAPTION_WORD_SOURCE_LOCAL_TRANSCRIPTION = 2;
  CAPTION_WORD_SOURCE_USER_EDITED = 3;
}

message CaptionProvenance {
  CaptionWordSource source = 1;
  string model_identity = 2;
}

message CaptionWord {
  EntityId id = 1;
  string text = 2;
  TimeRange range = 3;
  double probability = 4;
}

message Caption {
  EntityId id = 1;
  TimeRange range = 2;
  string text = 3;
  string language = 4;
  CaptionStyle style = 5;
  repeated CaptionWord words = 6;
  CaptionProvenance provenance = 7;
}

message Sequence {
  EntityId id = 1;
  string name = 2;
  Rate frame_rate = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint32 audio_sample_rate = 6;
  repeated Track tracks = 7;
  repeated Marker markers = 8;
  repeated Caption captions = 9;
  repeated Transition transitions = 10;
  optional Time start_time = 11;
}

enum MediaBinKind {
  MEDIA_BIN_KIND_UNSPECIFIED = 0;
  MEDIA_BIN_KIND_FOLDER = 1;
  MEDIA_BIN_KIND_SMART = 2;
}

message SmartQuery {
  repeated string tags = 1;
  optional int32 min_rating = 2;
  optional string notes_contains = 3;
  optional bool has_video = 4;
  optional bool has_audio = 5;
  optional string name_contains = 6;
  optional string scene_equals = 7;
  optional string shot_equals = 8;
  optional string take_equals = 9;
  optional bool preferred_take_only = 10;
}

message Subclip {
  EntityId id = 1;
  EntityId source_asset_id = 2;
  TimeRange source_range = 3;
  string name = 4;
  string notes = 5;
}

message SavedMediaView {
  EntityId id = 1;
  string name = 2;
  repeated string visible_columns = 3;
  SmartQuery search = 4;
}

message MediaBin {
  EntityId id = 1;
  string name = 2;
  optional EntityId parent_id = 3;
  MediaBinKind kind = 4;
  SmartQuery query = 5;
}

message MulticamAngle {
  EntityId id = 1;
  EntityId clip_id = 2;
  Time sync_offset = 3;
  string label = 4;
}

message MulticamSwitch {
  EntityId id = 1;
  Time time = 2;
  EntityId angle_id = 3;
}

message MulticamGroup {
  EntityId id = 1;
  EntityId sequence_id = 2;
  string name = 3;
  repeated MulticamAngle angles = 4;
  EntityId active_angle_id = 5;
  EntityId audio_master_angle_id = 6;
  Time sync_reference = 7;
  repeated MulticamSwitch switches = 8;
}

message Project {
  EntityId id = 1;
  string name = 2;
  repeated Asset assets = 3;
  repeated Sequence sequences = 4;
  repeated StringEntry metadata = 5;
  repeated MediaBin bins = 6;
  repeated MulticamGroup multicam_groups = 7;
  repeated Subclip subclips = 10;
  repeated SavedMediaView saved_media_views = 8;
  optional EntityId active_media_view_id = 9;
}

message ProjectSnapshot {
  uint32 schema_version = 1;
  uint32 minimum_reader_version = 2;
  Project project = 3;
}
